<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exclusão de conta</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f4f5f7;
        color: #1e2530;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 420px);
        padding: 36px;
        border: 1px solid #e2e5e9;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(28, 35, 45, 0.09);
        text-align: center;
      }

      .icon {
        display: grid;
        width: 56px;
        height: 56px;
        margin: 0 auto 20px;
        place-items: center;
        border-radius: 50%;
        background: #fff0f0;
        color: #c92a2a;
        font-size: 26px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 25px;
      }

      p {
        margin: 0;
        color: #667085;
        line-height: 1.55;
      }

      .masked-number {
        margin: 28px 0;
        padding: 16px;
        border-radius: 12px;
        background: #f7f8fa;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 5px;
        color: #343a40;
      }

      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        background: #d92d20;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: background 160ms ease, transform 160ms ease;
      }

      button:hover:not(:disabled) {
        background: #b42318;
        transform: translateY(-1px);
      }

      button:disabled {
        cursor: wait;
        opacity: 0.78;
      }

      .button-content {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .spinner {
        display: none;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.45);
        border-top-color: #ffffff;
        border-radius: 50%;
        animation: spin 700ms linear infinite;
      }

      button.loading .spinner {
        display: block;
      }

      .message {
        display: none;
        margin-top: 20px;
        padding: 14px;
        border: 1px solid #abefc6;
        border-radius: 12px;
        background: #ecfdf3;
        color: #067647;
        font-weight: 600;
      }

      .message.visible {
        display: block;
        animation: appear 300ms ease-out;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes appear {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">!</div>
      <h1>Excluir conta</h1>
      <p>A conta vinculada ao número abaixo será excluída permanentemente.</p>

      <div class="masked-number" aria-label="Número terminado em 42">••••••••42</div>

      <button id="deleteButton" type="button">
        <span class="button-content">
          <span class="spinner" aria-hidden="true"></span>
          <span class="button-label">Excluir minha conta</span>
        </span>
      </button>

      <div id="successMessage" class="message" role="status" aria-live="polite">
        Sua conta foi excluída com sucesso.
      </div>
    </main>

    <script>
      const button = document.querySelector("#deleteButton");
      const label = button.querySelector(".button-label");
      const message = document.querySelector("#successMessage");

      button.addEventListener("click", () => {
        button.disabled = true;
        button.classList.add("loading");
        label.textContent = "Excluindo...";
        message.classList.remove("visible");

        window.setTimeout(() => {
          button.classList.remove("loading");
          button.hidden = true;
          message.classList.add("visible");
        }, 2000);
      });
    </script>
  </body>
</html>
